        <meta name="description" content="Apeiron — an interactive 3D space-adventure portfolio. Explore Jefferson Laspiñas's universe to see his projects, skills, and achievements.">

        <meta itemprop="name" content="Apeiron">
        <meta itemprop="description" content="An interactive 3D space-adventure portfolio by Jefferson Laspiñas, built with Three.js and Vue.">
        <meta itemprop="image" content="https://field-notes-xi-eight.vercel.app/media/projects/3d-portfolio.webp">

        <meta name="twitter:card" content="summary_large_image">
        <meta name="twitter:title" content="Apeiron — Jefferson Laspiñas's Space Adventure Portfolio">

        <meta property="og:site_name" content="Apeiron">

        <meta property="og:url" content="https://field-notes-xi-eight.vercel.app/">
        <meta property="og:title" content="Apeiron — Jefferson Laspiñas's Space Adventure Portfolio">
        <meta property="og:description" content="An interactive 3D space-adventure portfolio by Jefferson Laspiñas, built with Three.js and Vue.">
        <meta property="og:image" content="https://field-notes-xi-eight.vercel.app/media/projects/3d-portfolio.webp">
    </head>
    <body>
        <div class="game">
            <div class="ui">
                <div class="mobile-warning">
                    For a better experience with 3D world interaction, open this portfolio on a desktop.
                </div>
                <div class="controls">
                    <div class="group">
                        <div class="element">
                            <div class="keys is-arrows">
                                <div class="key">A</div>
                                <div class="key">S</div>
                                <div class="key">D</div>
                                <div class="key">W</div>
                            </div>
                            move
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">F</div>
                            </div>
                            fullscreen
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">P</div>
                            </div>
                            pointer lock
                        </div>
                        <div class="element">
                            <div class="keys">
                                <div class="key">B</div>
                            </div>
                            settings
                        </div>
                    </div>
                </div>
            </div>
        </div>
        <script type="module" src="./sources/index.js"></script>
    </body>
</html>
